[project]
name = "vitality-server"
version = "0.1.0"
description = "Receives interactions uploaded by Vitality clients and stores them"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "vitality-protocol",
]

[tool.uv.sources]
vitality-protocol = { path = "../protocol", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
vitality-serverd = "vitality_server.daemon.main:main"
vitality-server = "vitality_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["vitality_server", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
