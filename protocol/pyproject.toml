[project]
name = "vitality-protocol"
version = "0.1.0"
description = "Interaction folder layout and upload contract shared by the Vitality client and server"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_protocol"]

[tool.pyright]
include = ["vitality_protocol", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
