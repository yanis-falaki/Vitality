[project]
name = "vitality-lab"
version = "0.1.0"
description = "Runs a Vitality stage on a fixed dataset and keeps a self-describing record of the run"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "vitality-modeler",
    "vitality-observer",
    "vitality-usermodel",
]

[tool.uv.sources]
vitality-modeler = { path = "../modeler", editable = true }
vitality-observer = { path = "../observer", editable = true }
vitality-protocol = { path = "../protocol", editable = true }
vitality-usermodel = { path = "../usermodel", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
    "pytest-asyncio",
    "types-PyYAML",
]

[project.scripts]
vitality-lab = "vitality_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_lab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["vitality_lab", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
