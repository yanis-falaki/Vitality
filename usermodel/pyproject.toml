[project]
name = "vitality-usermodel"
version = "0.1.0"
description = "The Vitality user model: file formats, IDs and checks for the Markdown files that describe its owner"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
    "types-PyYAML",
]

[project.scripts]
vitality-usermodel = "vitality_usermodel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_usermodel"]

[tool.pyright]
include = ["vitality_usermodel", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
