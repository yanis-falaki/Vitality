[project]
name = "vitality-web"
version = "0.1.0"
description = "A private, read-only web app for reading the user model: what it believes, why, and the evidence"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "vitality-usermodel",
]

[tool.uv.sources]
vitality-usermodel = { path = "../usermodel", editable = true }

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest",
]

[project.scripts]
vitality-web = "vitality_web.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_web"]

[tool.pyright]
include = ["vitality_web", "tests"]
# The smoke run needs Playwright, which is not a dependency (see tests/smoke.py).
exclude = ["tests/smoke.py"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
