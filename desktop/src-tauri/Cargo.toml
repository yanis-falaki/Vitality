[package]
name = "vitality-client"
version = "0.1.0"
description = "Vitality's desktop capture client: screens, capture policy, storage and upload"
edition = "2021"
publish = false

[[bin]]
name = "vitality-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
async-trait = "0.1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
evdev = "0.13"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
webp = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls"] }
ksni = "0.3"
base64 = "0.22"
libc = "0.2"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
axum = { version = "0.8", features = ["multipart"] }
tempfile = "3"

[features]
# Set by `tauri build`: serve the built interface from inside the binary.
custom-protocol = ["tauri/custom-protocol"]
