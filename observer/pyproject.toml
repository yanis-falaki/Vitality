[project]
name = "vitality-observer"
version = "0.1.0"
description = "Turns each captured Vitality interaction into a Markdown observation via Claude Code"
requires-python = ">=3.12"
dependencies = [
    "watchfiles",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
vitality-observerd = "vitality_observer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_observer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["vitality_observer", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
