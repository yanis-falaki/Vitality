# Vitality: the two long-running services, built from this checkout.
#   docker compose up -d --build     start (or update) both
#   docker compose ps                state and health
#   docker compose logs -f server    follow one service's log
# Settings come from .env (copy .env.example); see it for what each one does.

# Options both services share: they run as the data folder's owner and are locked down
# (the systemd sandbox of the old install, as container settings).
x-common: &common
  # Not root: files written to the data folder belong to the owner (VITALITY_UID:VITALITY_GID).
  user: "${VITALITY_UID:-1000}:${VITALITY_GID:-1000}"
  # Come back after a crash or a reboot, but stay down after `docker compose stop`.
  restart: unless-stopped
  # The image is immutable; anything a service writes goes to a mount or to /tmp.
  read_only: true
  tmpfs:
    - /tmp
  # No privilege gain, no Linux capabilities.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Keep logs from growing without bound: 3 files of 10 MB per service.
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:

  # Receives the interactions that clients upload and stores them under /data.
  server:
    <<: *common
    image: vitality-server
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["vitality-server", "serve"]
    # The host's network, so the server can listen on the host's Tailscale address (SERVER_PORT).
    network_mode: host
    environment:
      SERVER_PORT: ${SERVER_PORT:-8100}
      SERVER_ALLOWED_CLIENTS: ${SERVER_ALLOWED_CLIENTS:-}
    # The data mounts are in the long form with create_host_path: false, so a missing folder stops
    # `docker compose up` with an error instead of Docker creating it owned by root
    # (`./vitality setup` creates them). The short-form mounts below may be created.
    volumes:
      # Captures, upload staging and the index: the server's data.
      - type: bind
        source: ${VITALITY_DATA:-${HOME}/vitality-data}/server
        target: /data
        bind: {create_host_path: false}
      # How the server asks Tailscale who is calling: the directory holding the socket (short form:
      # /run is emptied at boot, so it may not exist yet when Docker starts). A restarted
      # tailscaled replaces the directory itself, which this mount cannot follow; the server then
      # finds Tailscale unreachable, exits after about 90 s, and Docker restarts it with a
      # fresh mount (see `serve` in server/vitality_server/daemon/main.py).
      - /var/run/tailscale:/var/run/tailscale
      # Log timestamps in the host's time zone.
      - /etc/localtime:/etc/localtime:ro
    # `vitality-server healthcheck` can take ~10 s (5 s to find the Tailscale address, 5 s for the HTTP call).
    healthcheck:
      test: ["CMD", "vitality-server", "healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  # Reads new captures and has Claude (through the Anthropic API) write an observation and the
  # operations of each interaction into /model.
  observer:
    <<: *common
    image: vitality-observer
    build:
      context: .
      dockerfile: observer/Dockerfile
    command: ["vitality-observer", "run"]
    # A small init as process 1, to reap any process that is left orphaned.
    init: true
    environment:
      # An empty key makes the observer refuse to start (other `docker compose` commands still work).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OBSERVER_MODE: ${OBSERVER_MODE:-direct}
      OBSERVER_PARALLEL: ${OBSERVER_PARALLEL:-4}
      OBSERVER_MODEL: ${OBSERVER_MODEL:-claude-sonnet-5-5}
      OBSERVER_EFFORT: ${OBSERVER_EFFORT:-low}
      OBSERVER_CALL_TIMEOUT_SECONDS: ${OBSERVER_CALL_TIMEOUT_SECONDS:-600}
    # As for the server: a missing source folder is an error, never created by Docker.
    volumes:
      # What the server captured: read-only, the observer never changes it.
      - type: bind
        source: ${VITALITY_DATA:-${HOME}/vitality-data}/server/captures
        target: /captures
        read_only: true
        bind: {create_host_path: false}
      # The observations and operations the observer writes: only these two folders of the model
      # (a git repo that the modeler will own), never the rest of it.
      - type: bind
        source: ${VITALITY_DATA:-${HOME}/vitality-data}/model/observations
        target: /model/observations
        bind: {create_host_path: false}
      - type: bind
        source: ${VITALITY_DATA:-${HOME}/vitality-data}/model/operations
        target: /model/operations
        bind: {create_host_path: false}
      # The observer's own record: calls.jsonl and skipped.txt.
      - type: bind
        source: ${VITALITY_DATA:-${HOME}/vitality-data}/observer
        target: /state
        bind: {create_host_path: false}
      # Timestamps in the host's time zone.
      - /etc/localtime:/etc/localtime:ro
