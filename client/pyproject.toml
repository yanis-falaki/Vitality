[project]
name = "vitality-client"
version = "0.1.0"
description = "Wayland screenshot-capture daemon for Vitality"
requires-python = ">=3.12"
dependencies = [
    "evdev",
    "dbus-fast",
    "Pillow",
    "python-ulid",
    "vitality-protocol",
    "httpx>=0.28.1",
]

[tool.uv.sources]
vitality-protocol = { path = "../protocol", editable = true }

[dependency-groups]
dev = [
    "pygobject-stubs>=2.20.0",
    "pyright>=1.1.414",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
vitality-client = "vitality_client.cli:main"
vitality-clientd = "vitality_client.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vitality_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # System PyGObject (not ours to fix): raised by the real GLib import in the frame source.
    "ignore:GLib.unix_signal_add_full is deprecated:gi.PyGIDeprecationWarning",
]

[tool.pyright]
include = ["vitality_client", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
# PyGObject's source lives in the system site-packages (see the README); its types come
# from pygobject-stubs, so a missing *source* is expected, not an error.
reportMissingModuleSource = "none"
